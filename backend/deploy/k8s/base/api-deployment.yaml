apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfir-api
  namespace: sfir
  labels:
    app.kubernetes.io/name: sfir-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: sfir
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sfir-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: sfir
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/metrics"
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: sfir-api
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: ghcr.io/sfir/sfir-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: sfir-config
            - secretRef:
                name: sfir-secrets
          env:
            - name: SFIR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sfir-secrets
                  key: SFIR_DB_PASSWORD
            - name: SFIR_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sfir-secrets
                  key: SFIR_JWT_SECRET_KEY
            - name: SFIR_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sfir-secrets
                  key: SFIR_ENCRYPTION_KEY
            - name: SFIR_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sfir-secrets
                  key: SFIR_OPENAI_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
