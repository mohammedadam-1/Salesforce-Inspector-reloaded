apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sfir-default-deny
  namespace: sfir
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sfir-api-allow-ingress
  namespace: sfir
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sfir-allow-internal
  namespace: sfir
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 5432
        - port: 6379
        - port: 8000
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
        - port: 80
  policyTypes:
    - Ingress
    - Egress
