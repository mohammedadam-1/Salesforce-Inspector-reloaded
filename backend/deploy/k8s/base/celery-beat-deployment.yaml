apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfir-celery-beat
  namespace: sfir
  labels:
    app.kubernetes.io/name: sfir-backend
    app.kubernetes.io/component: beat
    app.kubernetes.io/part-of: sfir
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sfir-backend
        app.kubernetes.io/component: beat
        app.kubernetes.io/part-of: sfir
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: beat
          image: ghcr.io/sfir/sfir-backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - sfir_backend.workers.celery
            - beat
            - --loglevel=info
            - --pidfile=/tmp/celerybeat.pid
          envFrom:
            - configMapRef:
                name: sfir-config
            - secretRef:
                name: sfir-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
