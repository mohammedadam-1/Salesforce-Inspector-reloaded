apiVersion: v1
kind: ConfigMap
metadata:
  name: sfir-config
  namespace: sfir
  labels:
    app.kubernetes.io/name: sfir-backend
    app.kubernetes.io/part-of: sfir
data:
  SFIR_ENVIRONMENT: "production"
  SFIR_DATABASE_URL: "postgresql+asyncpg://sfir:$(SFIR_DB_PASSWORD)@sfir-postgres:5432/sfir"
  SFIR_REDIS_URL: "redis://sfir-redis:6379/0"
  SFIR_CELERY_BROKER_URL: "redis://sfir-redis:6379/1"
  SFIR_CELERY_RESULT_BACKEND: "redis://sfir-redis:6379/2"
  SFIR_CORS_ORIGINS: "https://app.sfir.dev"
  SFIR_LOG_LEVEL: "INFO"
  SFIR_LOG_FORMAT: "json"
  SFIR_DATABASE_POOL_SIZE: "20"
  SFIR_DATABASE_MAX_OVERFLOW: "40"
  SFIR_RATE_LIMIT_DEFAULT: "2000"
  SFIR_OTLP_ENDPOINT: "http://sfir-otel-collector:4317"
  SFIR_JWT_ALGORITHM: "HS256"
  SFIR_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  SFIR_JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
