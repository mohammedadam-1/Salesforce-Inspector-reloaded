apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sfir.fullname" . }}-beat
  labels:
    {{- include "sfir.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  replicas: {{ .Values.celery.beat.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "sfir.labels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      containers:
        - name: beat
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - sfir_backend.workers.celery
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: {{ include "sfir.fullname" . }}-config
            - secretRef:
                name: {{ include "sfir.fullname" . }}-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
