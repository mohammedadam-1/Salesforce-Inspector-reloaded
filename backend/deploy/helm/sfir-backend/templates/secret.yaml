apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sfir.fullname" . }}-secrets
  labels:
    {{- include "sfir.labels" . | nindent 4 }}
type: Opaque
data:
  SFIR_DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  SFIR_JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | b64enc | quote }}
  SFIR_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  SFIR_OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  SFIR_ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
