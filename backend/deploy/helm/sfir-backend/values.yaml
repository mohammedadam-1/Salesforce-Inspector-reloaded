# ── Global ──────────────────────────────────────────────
global:
  environment: production
  imageRegistry: ghcr.io

# ── Image ───────────────────────────────────────────────
image:
  repository: sfir/sfir-backend
  tag: latest
  pullPolicy: Always

# ── API ─────────────────────────────────────────────────
api:
  replicas: 3
  minReplicas: 3
  maxReplicas: 20
  port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  hpa:
    cpuTargetUtilization: 70
    memoryTargetUtilization: 80
  autoscaling:
    enabled: true

# ── Workers ─────────────────────────────────────────────
celery:
  worker:
    replicas: 3
    concurrency: 8
    queues: "default,metadata,graph,ai"
    resources:
      requests:
        cpu: 1000m
        memory: 1Gi
      limits:
        cpu: 4000m
        memory: 4Gi
  beat:
    replicas: 1

# ── Database ────────────────────────────────────────────
postgresql:
  enabled: true
  storageSize: 100Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# ── Redis ───────────────────────────────────────────────
redis:
  enabled: true
  storageSize: 50Gi
  maxMemory: 2gb
  persistence: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# ── Ingress ─────────────────────────────────────────────
ingress:
  enabled: true
  host: api.sfir.dev
  tls: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod

# ── Observability ───────────────────────────────────────
observability:
  otlpEndpoint: "http://sfir-otel-collector:4317"
  logging:
    level: INFO
    format: json

# ── Security ────────────────────────────────────────────
security:
  rateLimitDefault: 2000
  corsOrigins: "https://app.sfir.dev"
  networkPolicies: true

# ── Secrets (set via --set or external-secrets) ─────────
secrets:
  dbPassword: ""
  jwtSecretKey: ""
  encryptionKey: ""
  openaiApiKey: ""
  anthropicApiKey: ""
