[project]
name = "sfir-backend"
version = "0.1.0"
description = "Production backend for an AI-powered Salesforce Inspector platform."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "sqlalchemy[asyncio]>=2.0.35",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

