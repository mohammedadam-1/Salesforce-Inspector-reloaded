global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "sfir-api"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /api/v1/health/metrics

  - job_name: "sfir-otel-collector"
    scrape_interval: 15s
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "sfir-postgres"
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "sfir-redis"
    scrape_interval: 30s
    static_configs:
      - targets: ["redis-exporter:9121"]
