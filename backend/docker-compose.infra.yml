# ────────────────────────────────────────────────────────────
# SFIR Backend — Infrastructure Services
# PostgreSQL, Redis, and Observability stack
# ────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfir-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sfir
      POSTGRES_PASSWORD: sfir
      POSTGRES_DB: sfir
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfir"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sfir-network

  redis:
    image: redis:7-alpine
    container_name: sfir-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - sfir-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sfir-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./docker/otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config", "/etc/otel-collector.yml"]
    depends_on:
      - prometheus
    networks:
      - sfir-network
    profiles:
      - full

  prometheus:
    image: prom/prometheus:latest
    container_name: sfir-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - sfir-network
    profiles:
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: sfir-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - sfir-network
    profiles:
      - full

volumes:
  postgres_data:
    name: sfir-postgres-data
  redis_data:
    name: sfir-redis-data
  prometheus_data:
    name: sfir-prometheus-data
  grafana_data:
    name: sfir-grafana-data

networks:
  sfir-network:
    name: sfir-network
    driver: bridge
