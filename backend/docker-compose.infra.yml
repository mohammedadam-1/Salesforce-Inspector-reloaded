services:
  postgres:
    image: postgres:16-alpine
    container_name: sfir-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sfir
      POSTGRES_PASSWORD: sfir
      POSTGRES_DB: sfir
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfir"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sfir-network

  redis:
    image: redis:7-alpine
    container_name: sfir-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sfir-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: sfir-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - ./docker/otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config", "/etc/otel-collector.yml"]
    networks:
      - sfir-network

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: sfir-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - sfir-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sfir-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sfir-admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - sfir-network

volumes:
  postgres-data:
    name: sfir-postgres-data
  redis-data:
    name: sfir-redis-data
  prometheus-data:
    name: sfir-prometheus-data
  grafana-data:
    name: sfir-grafana-data

networks:
  sfir-network:
    name: sfir-network
    external: true
